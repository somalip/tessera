name: Check
on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --prefix vscode-extension
      - if: runner.os == 'Windows'
        run: choco install make -y --no-progress
      - run: make check PYTHON=python
      - if: runner.os == 'Linux'
        run: xvfb-run -a make test-ext

  sandboxes:
    strategy:
      fail-fast: false
      matrix:
        language: [python, typescript, rust, go, java, c, cpp]
    runs-on: ubuntu-latest
    env:
      LANGUAGE: ${{ matrix.language }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m verifiers.prepare "$LANGUAGE"
      - if: matrix.language == 'python'
        run: TESSERA_DOCKER=docker python -m unittest discover -s tests -p test_evaluation.py
      - if: matrix.language != 'python'
        run: TESSERA_DOCKER_MATRIX=docker TESSERA_VERIFIER_LANG="$LANGUAGE" python -m unittest discover -s tests -p test_verifier_matrix.py
