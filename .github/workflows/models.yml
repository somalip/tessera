name: Train and gate candidate models
on:
  workflow_dispatch:
    inputs:
      config_directory:
        description: Absolute directory of licensed release configurations on the GPU runners
        required: true
        type: string

jobs:
  candidate:
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 4320
    strategy:
      fail-fast: false
      matrix:
        language: [python, typescript, rust, go, java, c, cpp]
    env:
      TINYCODERS_CONFIGS: ${{ inputs.config_directory }}
      LANGUAGE: ${{ matrix.language }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r train/requirements.txt
      - run: python -m verifiers.prepare "$LANGUAGE"
      - run: python -m ci.build_candidate "$TINYCODERS_CONFIGS/$LANGUAGE.yaml" "$LANGUAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.language }}-candidate
          path: artifacts/candidate/*.tcm
          if-no-files-found: error
